spring:
  profiles:
    active: ${APP_ENV:production}
  application:
    name: omnismart-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/omnismart}
    username: ${DATABASE_USERNAME:omnismart}
    password: ${DATABASE_PASSWORD:omnismart-local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: ${PRODUCT_MEDIA_MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${PRODUCT_MEDIA_MULTIPART_MAX_REQUEST_SIZE:6MB}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

omnismart:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  membership:
    invitation-ttl: ${MEMBERSHIP_INVITATION_TTL:PT72H}
  product-media:
    storage-root: ${PRODUCT_MEDIA_STORAGE_ROOT:./data/product-media}
    max-file-size: ${PRODUCT_MEDIA_MAX_FILE_SIZE:5MB}
    max-images-per-product: ${PRODUCT_MEDIA_MAX_IMAGES:8}
    temporary-retention: ${PRODUCT_MEDIA_TEMPORARY_RETENTION:PT24H}
    cleanup-interval: ${PRODUCT_MEDIA_CLEANUP_INTERVAL:PT1H}
    cleanup-initial-delay: ${PRODUCT_MEDIA_CLEANUP_INITIAL_DELAY:PT1H}
    cleanup-batch-size: ${PRODUCT_MEDIA_CLEANUP_BATCH_SIZE:100}
  security:
    oauth-rate-limit:
      max-requests: ${OAUTH_RATE_LIMIT_MAX_REQUESTS:10}
      window: ${OAUTH_RATE_LIMIT_WINDOW:PT1M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: OmniSmart Backend
    description: AI-assisted content operations for small stores
    version: 0.0.1-SNAPSHOT
