spring:
  application:
    name: omnismart-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/omnismart}
    username: ${DATABASE_USERNAME:omnismart}
    password: ${DATABASE_PASSWORD:omnismart-local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: OmniSmart Backend
    description: AI-assisted content operations for small stores
    version: 0.0.1-SNAPSHOT
