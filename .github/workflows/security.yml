name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reject secret file names
        shell: bash
        run: |
          set -euo pipefail
          blocked="$(git ls-files | grep -Ei '(^|/)(\.env|id_rsa|id_ed25519|.*\.(pem|p12|key))$' || true)"
          if [ -n "$blocked" ]; then
            echo "Potential secret-bearing files are tracked:"
            echo "$blocked"
            exit 1
          fi
      - name: Scan common credential formats
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nEI '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})' -- ':!.github/workflows/security.yml' || true)"
          if [ -n "$matches" ]; then
            echo "Potential credential detected:"
            echo "$matches"
            exit 1
          fi

