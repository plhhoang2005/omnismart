name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify required repository files
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md LICENSE NOTICE CONTRIBUTING.md SECURITY.md THIRD_PARTY_NOTICES.md CHANGELOG.md)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.pdf'; then
            echo "Unresolved merge-conflict marker found."
            exit 1
          fi
      - name: Reject committed environment files
        shell: bash
        run: |
          files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$files" ]; then
            echo "Environment files must not be committed:"
            echo "$files"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build when frontend exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f frontend/package-lock.json ]; then
            cd frontend
            npm ci
            npm run lint
            npm test -- --run
            npm run build
          else
            echo "Frontend has not been scaffolded yet."
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test and build when backend exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -x backend/mvnw ]; then
            cd backend
            ./mvnw --batch-mode --no-transfer-progress verify -Ppostgres-it
          elif [ -x backend/gradlew ]; then
            cd backend
            ./gradlew build
          else
            echo "Backend has not been scaffolded yet."
          fi
